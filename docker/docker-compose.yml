version: "3.8"

services:
  bifrost:
    build:
      context: ..
      dockerfile: Dockerfile
    image: bifrost:latest
    container_name: bifrost
    shm_size: "32g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    volumes:
      - ../data:/workspace/BIFrost/data
      - ../configs:/workspace/BIFrost/configs
      - ./outputs:/workspace/BIFrost/runs
      - ./models:/workspace/BIFrost/models
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - SWANLAB_API_KEY=${SWANLAB_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
